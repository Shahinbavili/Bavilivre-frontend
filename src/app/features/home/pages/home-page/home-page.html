<section class="hero">
  <div class="hero-content">
    <h1>
      {{ 'home.hero.title' | translate }}
    </h1>

    <p>
      {{ 'home.hero.subtitle' | translate }}
    </p>

    <div class="hero-actions">
      <a routerLink="/books" class="app-button app-button--primary">
        {{ 'navigation.catalog' | translate }}
      </a>

      @if (isAuthenticated()) {
        <a routerLink="/books/add" class="app-button app-button--secondary">
          {{ 'navigation.addBook' | translate }}
        </a>
      } @else {
        <a routerLink="/login" class="app-button app-button--secondary">
          {{ 'auth.login.title' | translate }}
        </a>

        <a routerLink="/register" class="app-button app-button--secondary">
          {{ 'auth.register.title' | translate }}
        </a>
      }
    </div>
  </div>
</section>
