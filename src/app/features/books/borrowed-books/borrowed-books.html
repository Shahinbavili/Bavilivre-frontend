<h2>{{ 'books.borrowed' | translate }}</h2>

@if ((borrowedBooks() | keyvalue).length > 0) {
  <ul>
    @for (book of borrowedBooks() | keyvalue; track book.key) {
      <li>
        {{ 'books.borrowed.item' | translate:{bookId: book.key, ownerId: book.value} }}
      </li>
    }
  </ul>
} @else {
  <p>{{ 'books.emptyBorrowed' | translate }}</p>
}
