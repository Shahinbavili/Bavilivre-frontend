<h2>{{ 'books.borrowed.title' | translate }}</h2>

@if (isLoading()) {
  <app-loading-spinner/>
} @else if (borrowedBookEntries().length > 0) {
  <ul>
    @for (entry of borrowedBookEntries(); track entry.bookId) {
      <li>
        {{ borrowedBookLabel(entry) }}
      </li>
    }
  </ul>
} @else {
  <p>{{ 'books.borrowed.empty' | translate }}</p>
}
