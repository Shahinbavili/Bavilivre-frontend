<article class="book-card">

  <h2 class="book-title">
    {{ book().title }}
  </h2>

  <p class="book-author">
    by {{ book().author }}
  </p>

  <div class="book-info">

    <div class="book-info-item">
      <span class="label">Language</span>
      <span class="value">{{ book().language }}</span>
    </div>

    <div class="book-info-item">
      <span class="label">Category</span>
      <span class="value">{{ book().category }}</span>
    </div>

  </div>

  <p
    class="book-status"
    [class.available]="book().available"
    [class.unavailable]="!book().available">

    {{ book().available ? 'Available' : 'Unavailable' }}

  </p>

  <div class="book-date">
    <span class="label">Created</span>

    <span class="value">
      {{ book().createdAt | date:'mediumDate' }}
    </span>
  </div>

  <footer class="book-actions">

    <!-- Future actions:
         Edit
         Archive
         Borrow
         Return
    -->

  </footer>

</article>
