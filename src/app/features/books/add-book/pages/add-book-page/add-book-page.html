<section class="book-form-page">
  <div class="book-form-card">
    <header class="book-form-card__header">
      <span class="book-form-card__icon" aria-hidden="true">
        <mat-icon>library_add</mat-icon>
      </span>

      <h1 class="app-page-title">
        {{ 'books.add.title' | translate }}
      </h1>
    </header>

    @if (submitError()) {
      <p class="submit-error" role="alert">
        {{ 'books.messages.createError' | translate }}
      </p>
    }

    <app-book-form
      [submitLabel]="'books.actions.create'"
      [submittingLabel]="'books.messages.creating'"
      [submitting]="submitting()"
      (submitted)="createBook($event)"
    />
  </div>
</section>
