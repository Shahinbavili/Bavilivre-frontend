<section class="add-book-page">
  <h1>
    {{ 'books.add.title' | translate }}
  </h1>

  @if (submitError()) {
    <p class="submit-error" role="alert">
      {{ 'books.messages.createError' | translate }}
    </p>
  }

  <app-book-form
    [submitLabel]="'books.actions.create'"
    [submittingLabel]="'books.messages.creating'"
    [submitting]="submitting()"
    (submitted)="createBook($event)"
  />
</section>
