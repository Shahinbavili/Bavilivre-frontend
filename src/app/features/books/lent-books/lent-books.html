<h2>{{ 'books.lent' | translate }}</h2>

@if ((lentBooks() | keyvalue).length > 0) {
  <ul>
    @for (book of lentBooks() | keyvalue; track book.key) {
      <li>
        Book {{ book.key }} owned by user {{ book.value }}
      </li>
    }
  </ul>
} @else {
  <p>{{ 'books.emptyLent' | translate }}</p>
}
